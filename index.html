<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>迷雾棋盘·真相探员 | 虚假信息识别闯关游戏</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #0a1c24, #030a0f);
            font-family: 'Segoe UI', 'Poppins', 'Fredoka One', 'Comic Neue', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        #fogCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.6;
            mix-blend-mode: screen;
        }
        #spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), transparent 0%, rgba(0,0,0,0.75) 70%);
            transition: background 0.05s ease;
        }
        .start-screen, .end-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #0b2b2f, #021016);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            backdrop-filter: blur(6px);
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .start-screen.hide, .end-screen.hide {
            opacity: 0;
            visibility: hidden;
        }
        .start-card, .end-card {
            max-width: 480px;
            width: 85%;
            background: rgba(10,20,28,0.85);
            backdrop-filter: blur(12px);
            border-radius: 64px;
            padding: 32px 28px 48px;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0,0,0,0.7), 0 0 0 2px rgba(80,140,180,0.4);
            animation: floatGlow 0.8s ease-out;
            border: 1px solid rgba(100,180,220,0.5);
        }
        @keyframes floatGlow {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* 终点星光闪烁动画 */
        @keyframes starGlow {
            0% { box-shadow: 0 0 0 0 #ffd966; background: #ffdf80; }
            100% { box-shadow: 0 0 20px 12px #ffb347; background: #ffeaac; }
        }
        .end-card-glow {
            animation: starGlow 0.8s ease-in-out 3;
        }
        .start-avatar, .end-avatar {
            width: 110px;
            height: 110px;
            background: linear-gradient(145deg, #2f6c7a, #1a4752);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 2px solid #7ab3cc;
        }
        .start-avatar img, .end-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .start-title, .end-title {
            font-size: 2.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #cceeff, #88ccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }
        .start-sub, .end-sub {
            font-size: 1rem;
            color: #b8dfef;
            background: rgba(0,0,0,0.4);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 60px;
            margin-bottom: 28px;
        }
        .start-btn, .end-btn {
            background: linear-gradient(145deg, #2f7a6e, #1e5548);
            border: none;
            padding: 14px 38px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 100px;
            color: #f0f9ff;
            cursor: pointer;
            box-shadow: 0 10px 0 #0f3a2e;
            transition: 0.08s linear;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #7bc4b0;
        }
        .start-btn:active, .end-btn:active { transform: translateY(5px); box-shadow: 0 5px 0 #0f3a2e; }
        .end-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .end-btn.small {
            padding: 10px 24px;
            font-size: 1.1rem;
            gap: 8px;
        }
        .end-score {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffeaac;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 60px;
            margin: 15px 0;
        }
        .end-message {
            font-size: 1rem;
            color: #e6f7ff;
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 40px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .start-footer {
            margin-top: 36px;
            font-size: 0.75rem;
            color: #7f9fb0;
            position: relative;
            z-index: 5;
        }
        .game-container {
            position: relative;
            z-index: 20;
            max-width: 620px;
            width: 100%;
            background: rgba(8,20,26,0.7);
            backdrop-filter: blur(8px);
            border-radius: 64px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
            overflow: hidden;
            padding: 22px 20px 28px;
            border: 1px solid rgba(80,150,180,0.5);
            opacity: 0;
            visibility: hidden;
            transform: scale(0.96);
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
        }
        .game-container.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 10px 18px;
            border-radius: 60px;
            color: #cdedff;
            margin-bottom: 24px;
            border-bottom: 1px solid #2f6f8a;
        }
        .score-box, .rank-box {
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 40px;
            color: #e2f0ff;
            font-weight: bold;
            font-size: 0.95rem;
            border-left: 2px solid #3d9ec0;
        }
        .item-count {
            background: #142e38;
            padding: 5px 14px;
            border-radius: 40px;
            display: flex;
            gap: 10px;
        }
        .perspective-btn {
            background: #2e6a5c;
            padding: 5px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid #1c4a3f;
        }
        .perspective-btn.disabled {
            background: #3f5f58;
            opacity: 0.6;
            pointer-events: none;
        }
        .board {
            margin-bottom: 20px;
        }
        .board-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .level-card {
            background: rgba(15,30,38,0.8);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #2f6f8a;
            transition: all 0.2s;
            cursor: pointer;
        }
        .level-card.foggy {
            background: #1c3e48;
            background-image: radial-gradient(circle at 30% 35%, rgba(130,200,230,0.3) 2%, transparent 2.5%);
            color: #8ab3c2;
        }
        .level-card.lit {
            background: #3c7a6b;
            border-color: #ffdd88;
            box-shadow: 0 0 8px rgba(255,221,136,0.3);
        }
        .level-card.start, .level-card.end {
            background: linear-gradient(145deg, #2f6b5c, #1e4f42);
            border-color: #7bc4b0;
            cursor: default;
        }
        .level-card.end {
            background: linear-gradient(145deg, #7a5c3a, #5c4022);
        }
        .level-title {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .level-status {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 20px;
            display: inline-block;
            background: rgba(0,0,0,0.4);
        }
        .level-status.completed {
            background: #2e6a5c;
            color: #ddf4ff;
        }
        .level-status.pending {
            background: #5f4a2e;
            color: #ffcf9a;
        }
        .progress-bar {
            background: #0a1c24;
            border-radius: 30px;
            padding: 4px;
            margin-top: 8px;
        }
        .progress-fill {
            background: #3c7a6b;
            height: 10px;
            border-radius: 30px;
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 8px;
            color: #bbd4e6;
        }
        .question-panel {
            display: none;
        }
        .question-panel.active {
            display: block;
        }
        .character {
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            border-radius: 56px;
            padding: 12px 20px;
            margin: 12px 0 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid #2f6f8a;
        }
        .avatar {
            background: linear-gradient(145deg, #3e7785, #255c68);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #7ab3cc;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .dialogue {
            flex: 1;
            font-weight: 500;
            color: #e6f7ff;
            background: rgba(0,0,0,0.6);
            padding: 12px 18px;
            border-radius: 48px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }
        .dialogue::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 20px;
            width: 0;
            height: 0;
            border: 10px solid transparent;
            border-right-color: rgba(0,0,0,0.6);
        }
        .question-card {
            background: rgba(15,30,38,0.8);
            backdrop-filter: blur(8px);
            border-radius: 56px;
            padding: 22px 20px;
            margin: 12px 0 18px;
            border: 1px solid #2f6f8a;
        }
        .media-container {
            width: 100%;
            margin-bottom: 16px;
            background: #0a1c22;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
        }
        .carousel-main {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-img { width: 100%; display: block; }
        .carousel-img img { width: 100%; height: auto; border-radius: 28px; display: block; }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            z-index: 5;
        }
        .carousel-btn.prev { left: 8px; }
        .carousel-btn.next { right: 8px; }
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 8px 0;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8ab3c2;
            cursor: pointer;
        }
        .dot.active {
            background: #ffdd88;
            transform: scale(1.2);
        }
        .question-text {
            font-size: 1rem;
            line-height: 1.45;
            background: rgba(0,0,0,0.5);
            padding: 18px;
            border-radius: 48px;
            font-weight: 600;
            margin-bottom: 24px;
            border-left: 6px solid #5db0c0;
            color: #eaf4ff;
        }
        .options {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 15px 0 10px;
        }
        .option-btn {
            background: linear-gradient(145deg, #1e4652, #12323c);
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #08222b;
            flex: 1;
            text-align: center;
            color: #e0f0fa;
            border: 1px solid #3f8aa0;
        }
        .option-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #08222b; }
        .hidden { display: none; }
        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 18px;
            color: #7f9fb0;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 60px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .feedback-modal {
            max-width: 380px;
            width: 88%;
            background: #10262ed9;
            backdrop-filter: blur(12px);
            border-radius: 64px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 30px 40px rgba(0,0,0,0.6), 0 0 0 2px #2f6f8a;
            border: 1px solid #6db0c0;
        }
        .modal-title {
            font-size: 1.7rem;
            font-weight: bold;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #cceeff, #88ccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .xiaozhen-in-modal {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #0a1c24cc;
            border-radius: 60px;
            padding: 8px 18px;
            margin-bottom: 20px;
            border: 1px solid #3f8aa0;
        }
        .xiaozhen-avatar-small {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #2f6c7a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 1.9rem;
            border: 1px solid #7ab3cc;
        }
        .xiaozhen-avatar-small img { width: 100%; height: 100%; object-fit: cover; }
        .xiaozhen-talk {
            flex: 1;
            background: #03161ed9;
            border-radius: 32px;
            padding: 8px 16px;
            font-size: 0.9rem;
            color: #ddf4ff;
            text-align: left;
        }
        .modal-body {
            font-size: 0.95rem;
            background: #0a1f28cc;
            padding: 18px;
            border-radius: 44px;
            margin: 12px 0;
            text-align: left;
            color: #d6ecf5;
            border: 1px solid #2f6f8a;
        }
        .modal-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-top: 20px;
        }
        .modal-btn {
            background: #2e6a5c;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            color: #e0f0fa;
        }
        .modal-btn.primary { background: #3f8aa0; color: white; }
        .evidence-list { font-size: 0.8rem; padding-left: 20px; margin: 8px 0; }
        .authority {
            background: #0a1c24;
            border-radius: 24px;
            padding: 8px 12px;
            margin-top: 12px;
            font-size: 0.75rem;
            color: #bbd4e6;
            border-left: 4px solid #5db0c0;
        }
        .authority a { color: #aae0ff; text-decoration: underline; }
        .technique-badge {
            background: #1e4652;
            padding: 6px 12px;
            border-radius: 30px;
            text-align: center;
            margin: 8px 0;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffeaac;
        }
        /* 图鉴相关样式 */
        .album-card-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 4px;
        }
        .album-card-item {
            background: #1c404c;
            border-radius: 28px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid #2f6f8a;
        }
        .album-card-item.unlocked {
            background: #1c404c;
        }
        .album-card-item.locked {
            background: #142e38;
            opacity: 0.6;
            cursor: default;
        }
        .album-card-item.unlocked:hover {
            background: #2a6070;
            transform: scale(1.01);
        }
        .album-card-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffeaac;
            margin-bottom: 6px;
        }
        .album-card-desc {
            font-size: 0.65rem;
            color: #bbd4e6;
        }
        .detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .detail-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .detail-card {
            max-width: 380px;
            width: 88%;
            background: #10262ed9;
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 30px 40px rgba(0,0,0,0.6), 0 0 0 2px #2f6f8a;
            border: 1px solid #6db0c0;
            max-height: 80vh;
            overflow-y: auto;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #3f8aa0;
            padding-bottom: 8px;
        }
        .detail-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffeaac;
        }
        .detail-close {
            background: #2e6a5c;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: white;
        }
        .detail-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 12px;
            gap: 16px;
        }
        .nav-btn {
            background: #3f8aa0;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .nav-btn:active { transform: scale(0.96); }
        .detail-index {
            font-size: 0.8rem;
            color: #bbd4e6;
        }
        .detail-content {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #e6f7ff;
        }
        .detail-content p {
            margin: 8px 0;
        }
        .badge-collector {
            display: inline-block;
            background: #ffb347;
            color: #2d2f36;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 4px 16px;
            border-radius: 60px;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
<canvas id="fogCanvas"></canvas>
<div id="spotlight"></div>

<div id="startScreen" class="start-screen">
    <div class="start-card">
        <div class="start-avatar" id="startAvatar"></div>
        <div class="start-title">迷雾棋盘·真相探员</div>
        <div class="start-sub">虚假信息识别闯关游戏</div>
        <button class="start-btn" id="startGameBtn">✨ 开始闯关 ✨</button>
        <div class="start-footer">网络迷雾重重，小真陪你辨真伪</div>
    </div>
</div>

<div id="endScreen" class="end-screen hide">
    <div class="end-card" id="endCard">
        <div class="end-avatar" id="endAvatar"></div>
        <div class="end-title" id="endTitle">通关结局</div>
        <div id="endBadge" style="min-height: 50px;"></div>
        <div class="end-score" id="endScore">0 分</div>
        <div class="end-message" id="endMessage">恭喜完成所有关卡！</div>
        <div class="end-buttons">
            <button class="end-btn small" id="endViewAlbumBtn">📖 查看图鉴</button>
            <button class="end-btn small" id="endPlayAgainBtn">✨ 再来一次</button>
        </div>
    </div>
</div>

<div id="gameContainer" class="game-container">
    <div class="stats-bar">
        <div class="score-box">✨ 积分: <span id="scoreValue">0</span></div>
        <div class="rank-box">🏅 <span id="rankTitle">信息甄别学徒</span></div>
        <div class="item-count">
            <span id="perspectiveBtn" class="perspective-btn">🔍 透视卡 <span id="透视剩余">2</span></span>
            <span id="openAlbumBtn" style="background:#2a5f6e; padding:5px 14px; border-radius:40px;">📖 图鉴</span>
        </div>
    </div>

    <div id="levelSelectPanel" class="board">
        <div id="boardGrid" class="board-grid"></div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>

    let width, height, fogParticles = [];
    function initFog() {
        width = window.innerWidth; height = window.innerHeight;
        fogCanvas.width = width; fogCanvas.height = height;
        for (let i = 0; i < 200; i++) fogParticles.push({ x: Math.random() * width, y: Math.random() * height, radius: Math.random() * 80 + 40, alpha: Math.random() * 0.25 + 0.1, speedX: (Math.random() - 0.5) * 0.3, speedY: (Math.random() - 0.5) * 0.15 });
        animateFog();
    }
    function animateFog() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        for (let p of fogParticles) {
            p.x += p.speedX; p.y += p.speedY;
            if (p.x < -100) p.x = width + 100; if (p.x > width + 100) p.x = -100;
            if (p.y < -100) p.y = height + 100; if (p.y > height + 100) p.y = -100;
            const grad = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, p.radius);
            grad.addColorStop(0, `rgba(100,180,210,${p.alpha * 0.6})`);
            grad.addColorStop(0.6, `rgba(60,120,150,${p.alpha * 0.3})`);
            grad.addColorStop(1, `rgba(30,70,90,0)`);
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = 'rgba(20,50,70,0.08)'; ctx.fillRect(0, 0, width, height);
        requestAnimationFrame(animateFog);
    }

    class ImageCarousel {
        constructor(container, imageUrls) {
            this.container = container;
            this.images = imageUrls.filter(url => url && url.trim() !== "");
            this.currentIndex = 0;
            if (this.images.length === 0) {
                this.container.style.display = 'none';
                return;
            }
            this.container.style.display = 'block';
            this.container.innerHTML = `
                <div class="carousel-main">
                    <button class="carousel-btn prev">‹</button>
                    <div class="carousel-img"><img src="" alt="配图" loading="lazy"></div>
                    <button class="carousel-btn next">›</button>
                </div>
                <div class="carousel-dots" id="carousel-dots"></div>
            `;
            this.imgElement = this.container.querySelector('.carousel-img img');
            this.prevBtn = this.container.querySelector('.prev');
            this.nextBtn = this.container.querySelector('.next');
            this.dotsContainer = this.container.querySelector('#carousel-dots');
            for (let i = 0; i < this.images.length; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                dot.addEventListener('click', () => this.goTo(i));
                this.dotsContainer.appendChild(dot);
            }
            this.dots = this.dotsContainer.querySelectorAll('.dot');
            this.prevBtn.addEventListener('click', () => this.prev());
            this.nextBtn.addEventListener('click', () => this.next());
            this.updateImage();
        }
        updateImage() {
            if (!this.imgElement) return;
            this.imgElement.src = this.images[this.currentIndex];
            this.imgElement.alt = "配图";
            this.dots.forEach((dot, idx) => {
                if (idx === this.currentIndex) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }
        prev() {
            if (this.images.length === 0) return;
            this.currentIndex = (this.currentIndex - 1 + this.images.length) % this.images.length;
            this.updateImage();
        }
        next() {
            if (this.images.length === 0) return;
            this.currentIndex = (this.currentIndex + 1) % this.images.length;
            this.updateImage();
        }
        goTo(index) {
            if (index >= 0 && index < this.images.length) {
                this.currentIndex = index;
                this.updateImage();
            }
        }
    }

        evidenceHtml += `<div class="authority">📌 ${linkify(currentQuestionObj.authority)}</div>`;
        let talkMsg = ["别灰心，下次记住这些依据。","两次都没对，我们下次再挑战这条！","记住了依据，以后就不会被骗啦。"][Math.floor(Math.random()*3)];
        setDialog(`小真：${talkMsg}`);
        await showModal("😔 两次均未答对", `<div>很遗憾，两次判断都不正确，迷雾未能消散。</div>${techniqueHtml}${evidenceHtml}`, [{ text: "继续", type: "primary", onClick: () => {} }], talkMsg);
        waitingRetry = false;
        await askNextLevel();
    }

    async function wrongFirstFlow() {
        if (!questionsStatus[currentPlayingLevel]) questionsStatus[currentPlayingLevel] = {};
        questionsStatus[currentPlayingLevel].hasWrongFirst = true;
        let guideHtml = `<div style="background:#0e2a32cc; padding:10px; border-radius:28px; margin-bottom:12px; border-left:4px solid #6db0c0;">💡 小真引导：${currentQuestionObj.clue}</div>`;
        let body = `${guideHtml}<hr><div style="text-align:center; margin: 6px 0;">🔁 请重新判断：</div>`;
        let talkMsg = ["没关系，我们一起学习，再试试看！","第一次没对不要紧，看看依据再选一次～","小真陪你分析，重新判断吧！"][Math.floor(Math.random()*3)];
        setDialog(`小真：${talkMsg}`);
        let buttons = [{ text: "✅ 判断为【真实】", type: "primary", value: "真实", onClick: () => {} },{ text: "⚠️ 判断为【可疑虚假】", type: "", value: "可疑虚假", onClick: () => {} }];
        let userChoice = await showModal("📢 辨别挑战", body, buttons, talkMsg);
        let isCorrect = (userChoice === currentQuestionObj.correct);
        if(isCorrect) await correctFlow(true, 5);
        else await finalWrongFlow();
    }

    async function handleChoice(choice) {
        if(waitingRetry) { setDialog("小真：请先完成当前弹窗中的二次判断"); return; }
        if (questionsStatus[currentPlayingLevel] && questionsStatus[currentPlayingLevel].finished) return;
        let isCorrect = (choice === currentQuestionObj.correct);
        if(isCorrect) await correctFlow(false, 10);
        else { waitingRetry = true; await wrongFirstFlow(); waitingRetry = false; }
    }

    async function usePerspective() {
        if(gameCompletedFlag){ setDialog("小真：游戏已通关"); return; }
        if(perspectiveRemaining <= 0){ setDialog("小真：没有透视卡次数了"); return; }
        if(perspectiveUsedOnCurrent){ setDialog("小真：本题已用过透视卡"); return; }
        const tip = currentQuestionObj.perspectiveTip || "本题套路：使用常见虚假信息手法，请根据引导和依据仔细判断。";
        let msg = ["透视卡揭示手法，谨慎判断～","使用透视卡！仔细看手法提示。","小真帮你分析：这道题的手法就藏在下面～"][Math.floor(Math.random()*3)];
        setDialog(`小真：${msg}`);
        let bodyHtml = `<div style="text-align:center; padding:4px;">🔍 ${tip}<br><br>💡 根据这个提示重新判断吧～</div>`;
        await showModal("🔍 透视卡", bodyHtml, [{ text: "知道了", type: "primary", onClick: () => {} }], msg);
        document.getElementById("extraHint").innerHTML = `<span style="background:#1c4652; padding:4px 12px; border-radius:30px;">💡 透视提示：${tip}</span>`;
        perspectiveRemaining--;
        perspectiveUsedOnCurrent = true;
        updatePerspectiveUI();
    }

    function initGameState() {
        questionsStatus = [];
        for(let i=0;i<12;i++) questionsStatus.push({ finished: false, finalCorrect: false, scoreEarned: 0, lit: false, hasWrongFirst: false });
        totalScore = 0;
        perspectiveRemaining = 2;
        waitingRetry = false;
        gameCompletedFlag = false;
        currentPlayingLevel = null;
        perspectiveUsedOnCurrent = false;
        updateScoreUI();
        renderLevelSelect();
        setDialog("欢迎探员！点击任意未挑战的关卡开始闯关吧！");
        updatePerspectiveUI();
        levelSelectPanel.style.display = 'block';
        questionPanel.classList.remove('active');
    }

    function loadAvatarFromLocal() {
        const createImg = (container) => {
            const img = document.createElement('img');
            img.src = XIAOZHEN_AVATAR_URL;
            container.innerHTML = '';
            container.appendChild(img);
        };
        createImg(xiaozhenAvatar);
        createImg(startAvatar);
        createImg(endAvatar);
    }
    xiaozhenAvatar.addEventListener("click", () => {
        setDialog("小真：我是小真，和我一起辨别信息真伪吧！");
    });

    document.getElementById("startGameBtn").addEventListener("click", () => {
        startScreenDiv.classList.add("hide");
        gameContainerDiv.classList.add("visible");
        loadAvatarFromLocal();
        initGameState();
    });
    perspectiveBtn.addEventListener("click", usePerspective);
    openAlbumBtn.addEventListener("click", () => { 
        buildAlbum(); 
        albumModal.classList.add("active"); 
    });
    closeAlbumBtn.addEventListener("click", () => { albumModal.classList.remove("active"); });
    document.getElementById("endViewAlbumBtn").addEventListener("click", () => {
        buildAlbum(); 
        albumModal.classList.add("active");
    });
    document.getElementById("endPlayAgainBtn").addEventListener("click", () => {
        resetGame();
    });
    closeDetailBtn.addEventListener("click", closeDetail);
    prevDetailBtn.addEventListener("click", prevDetail);
    nextDetailBtn.addEventListener("click", nextDetail);
    document.querySelectorAll(".option-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
            if (gameCompletedFlag) return;
            if (currentPlayingLevel === null) return;
            if(waitingRetry) { setDialog("小真：请先完成当前弹窗中的二次判断"); return; }
            handleChoice(btn.getAttribute("data-choice"));
        });
    });
    loadAvatarFromLocal();
</script>
</body>
</html>
